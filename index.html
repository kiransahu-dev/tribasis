<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Agency & Digital Solutions | Tribasis</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/tribasis.svg" />
    <link rel="apple-touch-icon" href="/tribasis.svg" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Tribasis is a professional digital agency delivering high-performance websites, UI/UX design, and digital solutions that help businesses grow online."
    />
    <meta
      name="keywords"
      content="digital agency, website development company, UI UX design services, frontend development, React development, digital agency India"
    />
    <meta name="author" content="Tribasis Web Services" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.tribasis.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tribasis Web Services | Web Development Agency" />
    <meta
      property="og:description"
      content="We build scalable, modern and high-performance web applications that help brands stand out and grow."
    />
    <meta property="og:url" content="https://www.tribasis.in/" />
    <meta property="og:image" content="https://www.tribasis.in/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tribasiskikas" />
    <meta name="twitter:creator" content="@tribasiskikas" />
    <meta name="twitter:title" content="Web Development Agency & Digital Solutions | Tribasis" />
    <meta
      name="twitter:description"
      content="High-performance websites and digital solutions for modern businesses."
    />
    <meta name="twitter:image" content="https://www.tribasis.in/og-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "name": "Tribasis Web Services",
        "url": "https://www.tribasis.in",
        "logo": "https://www.tribasis.in/tribasis.svg",
        "image": "https://www.tribasis.in/og-image.png",
        "description": "Tribasis is a professional digital agency delivering high-performance websites, UI/UX design, and digital solutions.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bengaluru",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.linkedin.com/company/tribasis",
          "https://www.instagram.com/_tribasis",
          "https://www.facebook.com/profile.php?id=61587379651598",
          "https://x.com/tribasiskikas"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "tribasis.services@gmail.com",
          "contactType": "customer support",
          "availableLanguage": "English"
        }
      }
    </script>

  <body class="selection:bg-primary selection:text-white">
